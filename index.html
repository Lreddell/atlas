<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="./build/icon.ico?v=__FAVICON_VERSION__" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Atlas</title>
    <meta name="description" content="Explore, build, craft, edit procedural worlds, and break the seal on the Magnetic Fields in this voxel action-adventure." />
    <link rel="canonical" href="https://atlas.loganreddell.com/" />
    <meta property="og:title" content="Atlas" />
    <meta property="og:description" content="Explore, build, craft, edit procedural worlds, and break the seal on the Magnetic Fields in this voxel action-adventure." />
    <meta property="og:url" content="https://atlas.loganreddell.com/" />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="/og-image.png" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "VideoGame",
        "name": "Atlas",
        "url": "https://atlas.loganreddell.com/",
        "description": "Explore, build, craft, edit procedural worlds, and break the seal on the Magnetic Fields in this voxel action-adventure.",
        "author": {
          "@type": "Person",
          "name": "Logan Reddell",
          "url": "https://loganreddell.com"
        }
      }
    </script>
    <script>
      document.documentElement.classList.add('js');

      try {
        const startupPreviewKey = 'atlas.menu.startupPanoramaPreview.v1';
        const startupPreviewVersion = __STARTUP_PREVIEW_VERSION__;
        const backgroundMode = window.localStorage.getItem('atlas.menu.backgroundMode') || 'panorama';
        const panoramaId = window.localStorage.getItem('atlas.menu.panoramaPath') || 'default';
        const cachedPreview = window.localStorage.getItem(startupPreviewKey);

        if (backgroundMode === 'panorama' && cachedPreview) {
          const parsedPreview = JSON.parse(cachedPreview);
          const previewMatches =
            parsedPreview &&
            parsedPreview.version === startupPreviewVersion &&
            parsedPreview.panoramaId === panoramaId &&
            typeof parsedPreview.dataUrl === 'string' &&
            parsedPreview.dataUrl.startsWith('data:image/');

          if (previewMatches) {
            const rawBlur = Number(window.localStorage.getItem('atlas.menu.panoramaBlur'));
            const rawGradient = Number(window.localStorage.getItem('atlas.menu.panoramaGradient'));
            const blur = Number.isFinite(rawBlur) ? Math.max(0, Math.min(12, rawBlur)) : 3;
            const gradient = Number.isFinite(rawGradient) ? Math.max(0, Math.min(0.9, rawGradient)) : 0.35;

            document.documentElement.style.setProperty('--atlas-startup-preview', `url("${parsedPreview.dataUrl}")`);
            document.documentElement.style.setProperty('--atlas-startup-blur', `${blur}px`);
            document.documentElement.style.setProperty('--atlas-startup-gradient', String(gradient));
            document.documentElement.style.setProperty('--atlas-startup-gradient-mid', String(gradient * 0.45));
            document.documentElement.classList.add('has-startup-preview');
          }
        }
      } catch {
        // Startup preview is best-effort. A bad cache must never delay Atlas boot.
      }

      const USE_MONOCRAFT_FONT = false;
      document.documentElement.dataset.atlasFont = USE_MONOCRAFT_FONT ? 'monocraft' : 'default';
    </script>
    <style>
      @font-face {
        font-family: 'Monocraft';
        src:
          local('Monocraft'),
          local('Monocraft-Regular'),
          url('./assets/fonts/Monocraft-ttf/Monocraft.ttf') format('truetype');
        font-weight: 400;
        font-style: normal;
        font-display: swap;
      }
      @font-face {
        font-family: 'Monocraft';
        src: url('./assets/fonts/Monocraft-ttf/weights/Monocraft-Italic.ttf') format('truetype');
        font-weight: 400;
        font-style: italic;
        font-display: swap;
      }
      @font-face {
        font-family: 'Monocraft';
        src: url('./assets/fonts/Monocraft-ttf/weights/Monocraft-ExtraLight.ttf') format('truetype');
        font-weight: 200;
        font-style: normal;
        font-display: swap;
      }
      @font-face {
        font-family: 'Monocraft';
        src: url('./assets/fonts/Monocraft-ttf/weights/Monocraft-ExtraLight-Italic.ttf') format('truetype');
        font-weight: 200;
        font-style: italic;
        font-display: swap;
      }
      @font-face {
        font-family: 'Monocraft';
        src: url('./assets/fonts/Monocraft-ttf/weights/Monocraft-Light.ttf') format('truetype');
        font-weight: 300;
        font-style: normal;
        font-display: swap;
      }
      @font-face {
        font-family: 'Monocraft';
        src: url('./assets/fonts/Monocraft-ttf/weights/Monocraft-Light-Italic.ttf') format('truetype');
        font-weight: 300;
        font-style: italic;
        font-display: swap;
      }
      @font-face {
        font-family: 'Monocraft';
        src: url('./assets/fonts/Monocraft-ttf/weights/Monocraft-SemiBold.ttf') format('truetype');
        font-weight: 600;
        font-style: normal;
        font-display: swap;
      }
      @font-face {
        font-family: 'Monocraft';
        src: url('./assets/fonts/Monocraft-ttf/weights/Monocraft-SemiBold-Italic.ttf') format('truetype');
        font-weight: 600;
        font-style: italic;
        font-display: swap;
      }
      @font-face {
        font-family: 'Monocraft';
        src: url('./assets/fonts/Monocraft-ttf/weights/Monocraft-Bold.ttf') format('truetype');
        font-weight: 700;
        font-style: normal;
        font-display: swap;
      }
      @font-face {
        font-family: 'Monocraft';
        src: url('./assets/fonts/Monocraft-ttf/weights/Monocraft-Bold-Italic.ttf') format('truetype');
        font-weight: 700;
        font-style: italic;
        font-display: swap;
      }
      @font-face {
        font-family: 'Monocraft';
        src: url('./assets/fonts/Monocraft-ttf/weights/Monocraft-Black.ttf') format('truetype');
        font-weight: 900;
        font-style: normal;
        font-display: swap;
      }
      @font-face {
        font-family: 'Monocraft';
        src: url('./assets/fonts/Monocraft-ttf/weights/Monocraft-Black-Italic.ttf') format('truetype');
        font-weight: 900;
        font-style: italic;
        font-display: swap;
      }
      :root {
        --atlas-ui-font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        --atlas-mono-font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
        --atlas-pixel-font-family: var(--atlas-ui-font-family);
      }
      :root[data-atlas-font='monocraft'] {
        --atlas-ui-font-family: 'Monocraft', monospace;
        --atlas-mono-font-family: 'Monocraft', monospace;
        --atlas-pixel-font-family: 'Monocraft', monospace;
      }
      body, html, #root {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #2f5cab;
        font-family: var(--atlas-ui-font-family);
        font-synthesis: none;
        user-select: none;
      }
      #root {
        position: relative;
        z-index: 1;
      }
      :root.has-startup-preview #root {
        background-color: transparent;
      }
      :root.has-startup-preview body::before {
        content: '';
        position: fixed;
        inset: -16px;
        z-index: 0;
        pointer-events: none;
        background-color: #2f5cab;
        background-image:
          linear-gradient(
            to bottom,
            rgba(0, 0, 0, var(--atlas-startup-gradient, 0.35)),
            rgba(0, 0, 0, var(--atlas-startup-gradient-mid, 0.1575)) 45%,
            rgba(0, 0, 0, var(--atlas-startup-gradient, 0.35))
          ),
          var(--atlas-startup-preview);
        background-position: center;
        background-repeat: no-repeat;
        background-size: cover;
        filter: blur(var(--atlas-startup-blur, 3px));
        transform: scale(1.03);
        transform-origin: center;
      }
      button,
      input,
      select,
      textarea {
        font: inherit;
      }
      #crosshair {
        position: absolute;
        top: 50%;
        left: 50%;
        width: 20px;
        height: 20px;
        transform: translate(-50%, -50%);
        pointer-events: none;
        z-index: 50;
      }
      #atlas-static-fallback {
        box-sizing: border-box;
        display: flex;
        height: 100%;
        width: 100%;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        padding: 24px;
        text-align: center;
      }
      :root.js #atlas-static-fallback {
        display: none;
      }
      #atlas-static-fallback h1,
      #atlas-static-fallback p {
        margin: 0;
        max-width: 720px;
      }
    </style>
</head>
  <body>
    <div id="root">
      <main id="atlas-static-fallback">
        <h1>Atlas</h1>
        <p>Explore, build, craft, edit procedural worlds, and break the seal on the Magnetic Fields in this voxel action-adventure.</p>
      </main>
    </div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
