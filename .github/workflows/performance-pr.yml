name: Performance PR Verification

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/performance-pr.yml'
      - 'package.json'
      - 'tsconfig.json'
      - 'src/**'
      - 'scripts/perf/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Run streaming tests
        run: npm run test:streaming

      - name: Build production bundle
        run: npm run build

      - name: Generate deterministic memory model
        run: npm run perf
